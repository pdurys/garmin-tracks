<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Track Viewer</title>
  
  <link rel="stylesheet" href="lib/leaflet.css" />
  <link rel="stylesheet" href="lib/MarkerCluster.css" />
  <link rel="stylesheet" href="lib/MarkerCluster.Default.css" />
  
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden; /* Stops scrollbars from appearing */
    }
    #map {
      width: 100%;
      height: 100vh; /* Takes up 100% of the viewport height */
    }
    #dbfile {
      position: absolute;
      top: 10px;
      left: 50px;
      z-index: 1000; /* Pushes the upload button to sit on top of the map */
    }
    /* Uniform width and positioning for both action buttons */
    #back-btn, #layer-toggle-btn {
      position: absolute;
      right: 15px; /* Aligned to the right edge */
      width: 160px; /* Forces both buttons to be exactly the same size */
      height: 38px; /* Consistent height for both */
      z-index: 1000;
      background: white;
      border: 2px solid rgba(0,0,0,0.2);
      border-radius: 4px;
      font-family: Arial, sans-serif;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 1px 5px rgba(0,0,0,0.4);
      box-sizing: border-box;
    }

    /* SWAPPED: Satellite Toggle is now permanent at the top */
    #layer-toggle-btn {
      top: 15px; 
    }

    /* SWAPPED: Back button pops up directly below it */
    #back-btn {
      top: 60px; 
      display: none; /* Stays hidden by default until a track is clicked */
    }

    /* Hover effect for both buttons */
    #back-btn:hover, #layer-toggle-btn:hover {
      background: #f4f4f4;
    }
  </style>

  <script src="lib/leaflet.js"></script>
  <script src="lib/leaflet.markercluster.js"></script>
  <script src="sql-wasm.js"></script> 
  <script src="app.js" defer></script>
</head>
<body>
  
  <button id="back-btn" onclick="goBackToPreviousView()">← Back to Overview</button>
  <button id="layer-toggle-btn" onclick="toggleMapLayer()">🛰️ Satellite View</button>
  
  <div id="map"></div>
</body>
</html>
