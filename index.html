<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Track Viewer</title>
  
  <link rel="stylesheet" href="lib/leaflet.css" />
  <link rel="stylesheet" href="lib/MarkerCluster.css" />
  <link rel="stylesheet" href="lib/MarkerCluster.Default.css" />
  
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh; /* Takes up 100% of the viewport height */
      overflow: hidden; /* Stops scrollbars from appearing */
    }
    #map {
      width: 100%;
      height: 100dvh; /* Takes up 100% of the viewport height */
    }
    #dbfile {
      position: absolute;
      top: 10px;
      left: 50px;
      z-index: 1000; /* Pushes the upload button to sit on top of the map */
    }
    /* Mobile phone collision avoidance for Leaflet controls */
    @media (max-width: 480px) {
      .responsive-right-panel {
        /* Pushes the right panel down below the left search bar */
        margin-top: 55px !important; 
      }
    }
  </style>

  <script src="lib/leaflet.js"></script>
  <script src="lib/leaflet.markercluster.js"></script>
  <script src="sql-wasm.js"></script> 
  <script src="app.js" defer></script>
</head>
<body>
  <div id="map"></div>
</body>
</html>
